[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitdash"
version = "0.1.0"
description = "A zero-dependency terminal dashboard for Git repository status"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAKE1266" }]
keywords = ["git", "terminal", "dashboard", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JAKE1266/gitdash"
Repository = "https://github.com/JAKE1266/gitdash"
Issues = "https://github.com/JAKE1266/gitdash/issues"

[project.scripts]
gitdash = "gitdash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
